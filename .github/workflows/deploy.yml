
name: Deploy Portfolio to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::824524314411:role/GitHubActions-Portfolio-Deploy
          aws-region: us-east-1

      - name: Upload portfolio to S3
        run: |
          aws s3 cp index.html s3://johnhawley.io/index.html \
            --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3GLP1KHKCE3VB \
            --paths "/*"
